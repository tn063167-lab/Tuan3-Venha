<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Bài tập 2</title>
<style>
body{font-family:Arial,sans-serif;
  /* 2d: logo 30px làm hình nền lặp lại và cố định */
  background:url("https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png") repeat fixed;
  background-size:30px;}
/* 2a */
.ueh{color:blue;text-align:center;font-weight:bold;text-decoration:underline;font-size:30px;}
/* 2b */
.cntt{color:red;text-align:right;font-style:italic;border:3px dotted gold;border-radius:12px;
  background:gray;font-size:15px;opacity:.5;}
/* 2c */
.bit{display:inline-block;margin:10px 0;padding:8px 18px;font:bold 40px Arial,sans-serif;
  color:#fff;background:radial-gradient(#d8e8a0,#a8c060);
  text-shadow:0 0 6px #c00,0 0 10px #c00,2px 2px 3px #800;}
/* 2e */
.box{background:#fff;width:100px;height:50px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
</style></head><body>
<p class="ueh">Đại học UEH</p>
<p class="cntt">Khoa CNTTKD</p>
<div class="bit">BIT-UEH</div>
<p class="box">Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều</p>
</body></html>
