<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Bài tập 7</title>
<style>
body{margin:0;font-size:20px;}
#wrapper{width:500px;height:520px;margin:20px auto;border:3px solid #000;padding:8px;
  box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px;box-shadow:12px 12px 0 #aaa;}
#wrapper>*{border:3px solid #000;box-sizing:border-box;padding:4px 8px;}
header{width:100%;height:70px;}
nav{width:90px;height:370px;}
main{width:calc(100% - 98px);height:370px;}
footer{width:100%;height:50px;}
</style></head><body>
<div id="wrapper">
 <header>header</header>
 <nav>nav</nav>
 <main>main</main>
 <footer>footer</footer>
</div>
</body></html>
