<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cà Phê Việt - Trang chủ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating@4.1.2/css/star-rating.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-star-rating@4.1.2/themes/krajee-svg/theme.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>

<div class="container-fluid">
  <!-- Slider (Carousel) -->
  <div id="carousel-example-generic" class="carousel slide" data-ride="carousel">
    <ol class="carousel-indicators">
      <li data-target="#carousel-example-generic" data-slide-to="0" class="active"></li>
      <li data-target="#carousel-example-generic" data-slide-to="1"></li>
      <li data-target="#carousel-example-generic" data-slide-to="2"></li>
    </ol>
    <div class="carousel-inner" role="listbox" id="slides"></div>
    <a class="left carousel-control" href="#carousel-example-generic" role="button" data-slide="prev"><span aria-hidden="true" style="position:absolute;top:50%;left:50%;font-size:30px">‹</span><span class="sr-only">Previous</span></a>
    <a class="right carousel-control" href="#carousel-example-generic" role="button" data-slide="next"><span aria-hidden="true" style="position:absolute;top:50%;left:50%;font-size:30px">›</span><span class="sr-only">Next</span></a>
  </div>

  <div class="row">
    <div class="col-sm-4 col-md-3" id="cats"></div>
    <div class="col-sm-8 col-md-9">
      <div class="row" id="list"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-star-rating@4.1.2/js/star-rating.min.js"></script>
<script src="app.js"></script>
<script>
  renderNav('ecommerce.html');
  renderCats('Danh mục');

  var banners = [
    banner('6f4e37', '3e2723', 'Cà phê rang mộc', 'Giảm đến 25% - Giao nhanh 2 giờ'),
    banner('2e7d32', '1b5e20', 'Arabica Cầu Đất', 'Hương thơm tinh tế - Hàng mới về'),
    banner('b23a1e', '7f1d0e', 'Combo quà tặng', 'Mua 2 tặng 1 phin nhôm')
  ];
  banners.forEach(function (src, i) {
    $('#slides').append('<div class="item' + (i === 0 ? ' active' : '') + '"><img src="' + src + '" alt="Banner ' + (i + 1) + '"></div>');
  });

  products.forEach(function (p) { $('#list').append(cardHtml(p)); });
  initStars('xs');
  initCommon();
</script>
</body>
</html>
