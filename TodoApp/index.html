<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO App – Quản lý công việc cá nhân</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">✅ TODO App <span class="badge-mode" id="mode"></span></div>
  <nav><a href="index.html" class="on">Công việc</a><a href="stats.html">Thống kê</a></nav>
</div></header>

<main class="wrap">
  <h1 id="heading">Công việc hôm nay</h1>
  <p class="sub" id="subtitle"></p>

  <div class="tabs" role="tablist">
    <button id="tabToday" class="on" data-scope="today">Hôm nay</button>
    <button id="tabAll" data-scope="all">Tất cả</button>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="🔍 Tìm theo tên hoặc mô tả...">
    <select id="fStatus"><option value="">Mọi trạng thái</option><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select>
    <select id="fPrio"><option value="">Mọi mức ưu tiên</option><option>Cao</option><option>Trung bình</option><option>Thấp</option></select>
    <select id="fCat"><option value="">Mọi danh mục</option><option>Học tập</option><option>Công việc</option><option>Cá nhân</option><option>Sức khỏe</option></select>
    <button class="btn" id="btnAdd">+ Thêm task</button>
  </div>

  <div id="notice"></div>
  <div class="list" id="list"></div>

  <div class="foot-actions">
    <button class="btn ghost" id="btnSeed">Nạp dữ liệu mẫu</button>
    <button class="btn ghost" id="btnClear">Xóa tất cả</button>
  </div>
</main>

<div class="ov" id="ov">
  <form class="modal" id="form" novalidate>
    <h2 id="mTitle">Thêm task</h2>
    <div class="field"><label for="fTitle">Tên công việc *</label><input id="fTitle" maxlength="120"></div>
    <div class="field"><label for="fDesc">Mô tả</label><textarea id="fDesc" rows="2" maxlength="300"></textarea></div>
    <div class="row2">
      <div class="field"><label for="fDue">Ngày thực hiện *</label><input type="date" id="fDue"></div>
      <div class="field"><label for="fSt">Trạng thái</label><select id="fSt"><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="fP">Ưu tiên</label><select id="fP"><option>Cao</option><option selected>Trung bình</option><option>Thấp</option></select></div>
      <div class="field"><label for="fC">Danh mục</label><select id="fC"><option>Học tập</option><option>Công việc</option><option>Cá nhân</option><option>Sức khỏe</option></select></div>
    </div>
    <div class="err" id="err"></div>
    <div class="btns"><button type="button" class="btn ghost" id="btnCancel">Hủy</button><button type="submit" class="btn">Lưu</button></div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script src="data/mock-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
