<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê – TODO App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">✅ TODO App <span class="badge-mode" id="mode"></span></div>
  <nav><a href="index.html">Công việc</a><a href="stats.html" class="on">Thống kê</a></nav>
</div></header>

<main class="wrap">
  <h1>Thống kê công việc</h1>
  <p class="sub">Tổng quan tiến độ và phân bố các task của bạn.</p>
  <div class="cards" id="cards"></div>
  <div class="grid2">
    <div class="panel"><h3>Tỷ lệ hoàn thành</h3><div class="donut" id="donut"></div></div>
    <div class="panel"><h3>Theo trạng thái</h3><div id="byStatus"></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Theo danh mục</h3><div id="byCat"></div></div>
    <div class="panel"><h3>Theo mức ưu tiên</h3><div id="byPrio"></div></div>
  </div>
  <div class="panel"><h3>7 ngày tới (xanh lá = đã hoàn thành)</h3><div class="days" id="days"></div></div>
</main>

<script src="data/mock-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
